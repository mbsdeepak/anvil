[project]
name = "anvil"
version = "0.1.0"
description = "A self-improving-agent flywheel — reflect on eval outcomes, remember the lessons, and get measurably better each iteration, in ~2k readable lines of Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Deepak" }]
keywords = ["llm", "agent", "self-improvement", "reflexion", "memory", "eval"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "loom",
    "gauntlet",
    "sonar",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
anvil = "anvil.cli:main"

[project.urls]
Homepage = "https://github.com/mbsdeepak/anvil"

[tool.uv.sources]
loom = { path = "../loom", editable = true }
gauntlet = { path = "../gauntlet", editable = true }
sonar = { path = "../sonar", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvil"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
